name: spotq-platform

# ==============================================================================
# Production-Grade Docker Compose Stack for SpotQ Microservices & API Gateway
# Compatible with: infisical run --env=dev -- docker compose up
# ==============================================================================

services:

  # ─── Edge / Ingress: API Gateway (Envoy Proxy) ───────────────────────────────
  api-gateway:
    build:
      context: ../spotq-api-gateway
      dockerfile: Dockerfile

    container_name: spotq-api-gateway

    restart: unless-stopped

    ports:
      - "10000:10000"
      - "9901:9901"

    networks:
      - spotq-frontend
      - spotq-backend
    depends_on:
      user-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      queue-service:
        condition: service_started
      ml-eta-service:
        condition: service_started

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:10000/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Microservice: User Service ─────────────────────────────────────────
  user-service:
    build:
      context: ../spotq-user-service
      dockerfile: Dockerfile

    container_name: spotq-user-service

    restart: unless-stopped

    environment:
      INFISICAL_TOKEN: ${USER_INFISICAL_TOKEN}

    networks:
      - spotq-backend
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Microservice: Restaurant Service ─────────────────────────────────────────
  restaurant-service:
    build:
      context: ../spotq-restaurant-service
      dockerfile: Dockerfile

    container_name: spotq-restaurant-service

    restart: unless-stopped

    environment:
      INFISICAL_TOKEN: ${RESTAURANT_INFISICAL_TOKEN}

    networks:
      - spotq-backend
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Microservice: Order Service ──────────────────────────────────────────────
  order-service:
    build:
      context: ../spotq-order-service
      dockerfile: dockerfile

    container_name: spotq-order-service

    restart: unless-stopped

    environment:
      INFISICAL_TOKEN: ${ORDER_INFISICAL_TOKEN}

    networks:
      - spotq-backend

    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Microservice: Payment Service ────────────────────────────────────────────
  payment-service:
    build:
      context: ../spotq-payment-service
      dockerfile: Dockerfile

    container_name: spotq-payment-service

    restart: unless-stopped

    environment:
      INFISICAL_TOKEN: ${PAYMENT_INFISICAL_TOKEN}

    networks:
      - spotq-backend

    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Microservice: Queue Service ──────────────────────────────────────────────
  queue-service:
    build:
      context: ../spotq-queue-service
      dockerfile: Dockerfile

    container_name: spotq-queue-service

    restart: unless-stopped

    environment:
      INFISICAL_TOKEN: ${QUEUE_INFISICAL_TOKEN}

    networks:
      - spotq-backend

    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3004/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Microservice: ML ETA Service ─────────────────────────────────────────────
  ml-eta-service:
    build:
      context: ../spotq-ml-eta-service
      dockerfile: Dockerfile

    container_name: spotq-ml-eta-service

    restart: unless-stopped

    environment:
      INFISICAL_TOKEN: ${ETA_INFISICAL_TOKEN}

    networks:
      - spotq-backend

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Observability: Prometheus ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: spotq-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/config.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver

  networks:
    - spotq-backend

  # ─── Observability: Grafana ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.3
    container_name: spotq-grafana
    restart: unless-stopped

    ports:
      - "3006:3000"

    volumes:
      - ./monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

    networks:
      - spotq-backend
      - spotq-frontend

    environment:
      INFISICAL_TOKEN: st.2b118315-6eb9-4c33-931b-ae20b5ee813a.bbd58b0810ffcd583089769e33a6eda3.c88edbbd5058c90bde225498ae1fa196

  # ─── Observability: Loki ────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.1
    container_name: spotq-loki
    restart: unless-stopped

    ports:
      - "3100:3100"

    command:
      - -config.file=/etc/loki/config.yaml

    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yaml:ro
      - loki-data:/loki

    networks:
      - spotq-backend

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

  # ─── Observability: Tempo ───────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.5.0
    container_name: spotq-tempo
    restart: unless-stopped

    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    
    command: 
      - -config.file=/etc/tempo/tempo.yaml
  
    volumes:
      - ./monitoring/tempo/config.yml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - spotq-backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

  # ─── Observability: Alertmanager ────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: spotq-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

    volumes:
    - ./monitoring/alertmanager/config.yml:/etc/alertmanager/alertmanager.yml:ro
    - alertmanager-data:/alertmanager

    networks:
      - spotq-backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ─── Observability: Grafana Alloy ───────────────────────────────────────────
  alloy:
    image: grafana/alloy:v1.3.0
    container_name: spotq-alloy
    restart: unless-stopped

    ports:
      - "12345:12345"

    volumes:
      - ./monitoring/alloy/config.hcl:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    networks:
      - spotq-backend

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  # Public ingress network for external traffic hitting the API Gateway
  spotq-frontend:
    name: spotq-frontend
    driver: bridge

  # Private application network for API gateway to backend microservices communication
  spotq-backend:
    name: spotq-backend
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  prometheus-data:
    name: spotq-prometheus-data
  grafana-data:
    name: spotq-grafana-data
  loki-data:
    name: spotq-loki-data
  tempo-data:
    name: spotq-tempo-data
  alloy-data:
    name: spotq-alloy-data
